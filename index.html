<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvaExplorer XP</title>
<link rel="stylesheet" href="assets/xp-ui/theme.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="titlebar" id="titlebar">
  <div class="title-left"><svg class="app-logo" aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-computer"/></svg><span>AvaExplorer</span></div>
  <div class="window-buttons">
    <button id="minimizeBtn" class="caption-btn minimize" aria-label="Minimize" title="Minimize"><span></span></button>
    <button id="maximizeBtn" class="caption-btn maximize" aria-label="Maximize" title="Maximize"><span></span></button>
    <button id="closeBtn" class="caption-btn close" aria-label="Close" title="Close"><span></span></button>
  </div>
</header>
<div class="menubar"><span>File</span><span>Edit</span><span>View</span><span>Favorites</span><span>Tools</span><span>Help</span></div>
<div class="toolbar">
  <button id="backBtn" title="Back"><svg aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-back"/></svg><small>Back</small></button>
  <button id="forwardBtn" title="Forward" disabled><svg aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-forward"/></svg><small>Forward</small></button>
  <button id="upBtn" title="Up one level"><svg aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-up"/></svg><small>Up</small></button>
  <span class="tool-separator"></span>
  <button id="searchBtn" title="Search"><svg aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-search"/></svg><small>Search</small></button>
  <button id="foldersBtn" title="Toggle folders pane"><svg aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-folders"/></svg><small>Folders</small></button>
  <span class="toolbar-spacer"></span>
  <button id="viewBtn" title="View options"><svg aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-details"/></svg><small>Views</small></button>
</div>
<div class="address-row"><b>Address</b><svg class="address-icon" aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-folder"/></svg><input id="address" spellcheck="false" aria-label="Address"><button id="goBtn">Go</button></div>
<div class="main">
  <aside class="sidebar">
    <section class="task-panel">
      <h3>File and Folder Tasks <span>⌃</span></h3>
      <button id="newFolderBtn"><svg aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-new-folder"/></svg>Make a new folder</button>
      <button id="renameBtn"><svg aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-rename"/></svg>Rename this item</button>
      <button id="deleteBtn"><svg aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-delete"/></svg>Delete this item</button>
    </section>
    <section class="task-panel places">
      <h3>Other Places <span>⌃</span></h3>
      <button data-place="home"><svg aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-documents"/></svg>My Documents</button>
      <button data-place="drives"><svg aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-computer"/></svg>My Computer</button>
      <button data-place="desktop"><svg aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-desktop"/></svg>Desktop</button>
      <button data-place="downloads"><svg aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-downloads"/></svg>Downloads</button>
    </section>
    <section class="task-panel details">
      <h3>Details <span>⌃</span></h3>
      <p id="selectedDetails">Select a file or folder to view its details.</p>
    </section>
  </aside>
  <main class="file-area">
    <div class="view-heading"><svg id="folderIcon" aria-hidden="true"><use href="assets/xp-ui/icons.svg#xp-folder-open"/></svg><strong id="folderTitle">Loading...</strong></div>
    <div class="list-header"><span>Name</span><span>Size</span><span>Type</span><span>Date Modified</span></div>
    <div id="fileList" class="file-list"></div>
    <div id="emptyState" class="empty-state" hidden>This folder is empty.</div>
  </main>
</div>
<footer class="statusbar"><span id="statusText">Ready</span><span id="itemCount">0 objects</span></footer>
<div id="dialogShade" class="dialog-shade" hidden>
  <div class="dialog">
    <div class="dialog-title"><span id="dialogTitle">AvaExplorer</span><button id="dialogClose" aria-label="Close dialog">×</button></div>
    <div id="dialogBody"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
